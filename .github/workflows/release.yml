# Installers for Windows, macOS (Apple silicon and Intel) and Linux, each installed and
# started on a fresh machine before it's kept (scripts/smoke_installer.py). Runs by hand
# (Actions → Installers → Run workflow) and on a version tag (v2.0.0), which also drafts a
# GitHub release with the installers and latest.json for the in-app updater.
#
# Signing updates needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the private key
# whose public half is in tauri.conf.json); without it the installers build unsigned for
# updates and latest.json is skipped.

name: Installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, key: windows-x86_64 }
          - { os: macos-15, key: darwin-aarch64 }
          - { os: macos-15-intel, key: darwin-x86_64 }
          - { os: ubuntu-22.04, key: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4

      - name: Linux disk space
        if: runner.os == 'Linux'
        # The runner has ~14 GB free; the build, the runtime and three packages (and the
        # AppImage check, which unpacks one) need more. Drop toolchains this job never uses.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup             /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev xvfb libfuse2 file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false  # its post-job cache step hung on macOS

      - name: Interface
        run: |
          npm ci --prefix ui
          npm --prefix ui run build

      - name: Engine runtime (Python and the engine's dependencies)
        run: uv run --no-project --python 3.12 scripts/bundle_engine.py

      - name: Installers
        shell: bash
        run: |
          npm ci --prefix apps/desktop
          extra=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then extra="--config src-tauri/tauri.updater.json"; fi
          # macOS: Tauri builds the .app only; scripts/make_dmg.py makes the disk image, since
          # Tauri's own dmg step scripts Finder and fails on headless runners.
          if [ "$RUNNER_OS" = "macOS" ]; then extra="$extra --bundles app"; fi
          cd apps/desktop && npx tauri build --config src-tauri/tauri.bundle.json $extra
          if [ "$RUNNER_OS" = "macOS" ]; then python3 ../../scripts/make_dmg.py; fi

      - name: Install and start them
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a uv run --no-project --python 3.12 scripts/smoke_installer.py
          else
            uv run --no-project --python 3.12 scripts/smoke_installer.py
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.key }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sig
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.sig
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release files and latest.json
        run: python3 scripts/release_files.py artifacts release --tag "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* --draft \
            --title "Pantheon Studio ${GITHUB_REF_NAME#v}" --generate-notes
