[project]
name = "pantheon-server"
version = "0.1.0"
license = "Apache-2.0"
description = "Pantheon - transparent AI agent organizations runtime"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "langgraph>=1.2",
    "langchain-core>=0.3",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "cryptography>=42",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "ddgs>=9.16.0",
    "mcp>=1.20",
    "jsonschema>=4.26.0",
    "python-multipart>=0.0.32",
    "croniter>=6.2.4",
    "playwright>=1.63.0",
    "tzdata>=2026.4",
    "fastembed>=0.8.1",
    "pgvector>=0.5.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "datamodel-code-generator>=0.25",
    "freezegun>=1.4",
    "httpx-ws>=0.9.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["SIM102", "SIM105", "SIM115", "SIM117", "SIM108", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501", "W291"]
"app/api/*" = ["B008"]
[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
